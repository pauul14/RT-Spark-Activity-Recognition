plugins { id 'com.android.application' }
android {
    namespace 'edu.bca182.activity'
    compileSdk 35
    defaultConfig {
        applicationId 'edu.bca182.activity'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-three-class-offline-candidate'
        testInstrumentationRunner 'edu.bca182.activity.MonitorSmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    signingConfigs { debug { storeFile file("${rootDir}/.android-user/debug.keystore") } }
    testOptions { unitTests.returnDefaultValues = false }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // android.jar's org.json is a stub in JVM tests
}
